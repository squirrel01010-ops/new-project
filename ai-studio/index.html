<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DREAM CANVAS</title>
  <meta name="description" content="나만 쓰는 AI 그림 생성 스튜디오">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff5fa2'/><path d='M9 22l5-7 4 5 3-3 4 5z' fill='white'/><circle cx='21' cy='11' r='3' fill='white'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span>DREAM CANVAS</span>
    </div>
    <div class="engine-pill" id="enginePill" title="현재 엔진"></div>
    <button class="icon-btn" id="openSettings" type="button" aria-label="설정">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main class="layout">
    <form class="panel" id="genForm" autocomplete="off">
      <label class="field">
        <span class="label">무엇을 그릴까요?</span>
        <textarea id="prompt" rows="5" maxlength="2000" placeholder="예: 벚꽃이 흩날리는 언덕 위에 서 있는 은발 소녀, 노을, 바람에 날리는 머리카락"></textarea>
      </label>

      <details class="field" id="negWrap">
        <summary class="label">빼고 싶은 것 <small>(네거티브 · 내 PC 엔진 전용)</small></summary>
        <textarea id="negative" rows="2" maxlength="1000" placeholder="lowres, bad hands, blurry, watermark"></textarea>
      </details>

      <div class="field">
        <span class="label">그림체</span>
        <div class="chips" id="styles" role="radiogroup" aria-label="그림체"></div>
      </div>

      <div class="field">
        <span class="label">비율</span>
        <div class="chips ratios" id="ratios" role="radiogroup" aria-label="비율"></div>
      </div>

      <div class="row">
        <label class="field grow">
          <span class="label">모델</span>
          <select id="model"></select>
        </label>
        <label class="field count">
          <span class="label">장수</span>
          <select id="count">
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4" selected>4</option>
          </select>
        </label>
      </div>

      <div class="row seed-row">
        <label class="field grow">
          <span class="label">시드</span>
          <input id="seed" type="number" min="0" max="2147483647" placeholder="비우면 매번 랜덤">
        </label>
        <button class="ghost" type="button" id="clearSeed" title="랜덤으로">🎲 랜덤</button>
      </div>

      <button class="primary" id="generate" type="submit">
        <span class="btn-text">그리기</span>
        <kbd>Ctrl + Enter</kbd>
      </button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <section class="results">
      <div class="section-head">
        <h2>방금 그린 그림</h2>
      </div>
      <div class="grid current" id="current">
        <div class="empty">왼쪽에 그리고 싶은 장면을 쓰고 <b>그리기</b>를 눌러 보세요.</div>
      </div>

      <div class="section-head">
        <h2>내 갤러리 <span class="muted" id="galleryCount"></span></h2>
        <button class="ghost small" type="button" id="clearGallery">전체 삭제</button>
      </div>
      <div class="grid gallery" id="gallery"></div>
    </section>
  </main>

  <dialog id="viewer" class="viewer">
    <div class="viewer-body">
      <img id="viewerImg" alt="">
      <aside class="viewer-info">
        <p class="viewer-prompt" id="viewerPrompt"></p>
        <dl id="viewerMeta"></dl>
        <div class="viewer-actions">
          <button class="primary small" type="button" id="viewerDownload">다운로드</button>
          <button class="ghost small" type="button" id="viewerReuse">이 설정 다시 쓰기</button>
          <button class="ghost small danger" type="button" id="viewerDelete">삭제</button>
          <button class="ghost small" type="button" id="viewerClose">닫기</button>
        </div>
      </aside>
    </div>
  </dialog>

  <dialog id="settings" class="settings">
    <form method="dialog" id="settingsForm">
      <h2>설정</h2>

      <fieldset>
        <legend>그림 엔진</legend>
        <label class="radio">
          <input type="radio" name="engine" value="pollinations">
          <span><b>Pollinations</b> (인터넷)<br><small>무료 계정의 API 키로 무료 모델을 써요. 그래픽카드가 없어도 돼요.</small></span>
        </label>
        <label class="radio">
          <input type="radio" name="engine" value="local">
          <span><b>내 PC</b> (Stable Diffusion Forge / WebUI)<br><small>완전 무료에 횟수 제한도 없어요. 애니메 모델을 마음대로 쓸 수 있어요. NVIDIA 그래픽카드가 필요해요.</small></span>
        </label>
      </fieldset>

      <fieldset data-engine="pollinations">
        <legend>Pollinations</legend>
        <label class="field">
          <span class="label">API 키 (sk_…)</span>
          <input id="pollKey" type="password" placeholder="sk_로 시작하는 키" spellcheck="false">
        </label>
        <p class="hint">
          <a href="https://enter.pollinations.ai/keys" target="_blank" rel="noopener">enter.pollinations.ai/keys</a>에서 무료로 만들 수 있어요.
          키를 만들 때 <b>예산 한도</b>를 작게 걸어 두세요. 키는 이 브라우저에만 저장돼요.
        </p>
        <label class="check"><input type="checkbox" id="showPaid"> 유료 모델도 목록에 보이기</label>
      </fieldset>

      <fieldset data-engine="local">
        <legend>내 PC</legend>
        <label class="field">
          <span class="label">WebUI 주소</span>
          <input id="localUrl" type="url" placeholder="http://127.0.0.1:7860" spellcheck="false">
        </label>
        <div class="row">
          <label class="field grow"><span class="label">스텝</span><input id="localSteps" type="number" min="1" max="150"></label>
          <label class="field grow"><span class="label">CFG</span><input id="localCfg" type="number" min="1" max="30" step="0.5"></label>
        </div>
        <label class="field">
          <span class="label">샘플러</span>
          <input id="localSampler" type="text" placeholder="Euler a" spellcheck="false">
        </label>
        <button class="ghost small" type="button" id="testLocal">연결 확인</button>
        <p class="hint">WebUI를 <code>--api --cors-allow-origins=*</code> 옵션으로 켜야 해요. 자세한 방법은 README에 있어요.</p>
      </fieldset>

      <div class="settings-actions">
        <button class="primary small" value="save" id="saveSettings">저장</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
